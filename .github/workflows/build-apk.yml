name: Build Mythos Functional APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Download official libXray v26.7.28 Android bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs /tmp/libxray
          API="https://api.github.com/repos/XTLS/libXray/releases/tags/v26.7.28"
          ASSET_URL="$(curl -fsSL -H "Accept: application/vnd.github+json" "$API" | jq -r '.assets[] | select((.name | ascii_downcase | contains("android")) and (.name | ascii_downcase | endswith(".zip"))) | .browser_download_url' | head -n 1)"
          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "Could not locate the official Android ZIP asset in libXray v26.7.28"
            exit 1
          fi
          curl -fL --retry 3 "$ASSET_URL" -o /tmp/libxray/android.zip
          unzip -q /tmp/libxray/android.zip -d /tmp/libxray/extracted
          AAR_PATH="$(find /tmp/libxray/extracted -type f -name 'libXray.aar' -print -quit)"
          if [ -z "$AAR_PATH" ]; then
            echo "Android bundle did not contain libXray.aar"
            find /tmp/libxray/extracted -maxdepth 3 -type f -print
            exit 1
          fi
          cp "$AAR_PATH" app/libs/libXray.aar
          test -s app/libs/libXray.aar
          echo "Installed $(du -h app/libs/libXray.aar | cut -f1) app/libs/libXray.aar"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/debug/app-debug.apk artifact/Mythos-Functional.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Mythos-Functional-APK
          path: artifact/Mythos-Functional.apk
          if-no-files-found: error
